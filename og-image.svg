<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"
  width="1200" height="630">

  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0F1115"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="48" height="48"
      patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none"
        stroke="rgba(0,255,136,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Outer border -->
  <rect x="12" y="12" width="1176" height="606" fill="none"
    stroke="#00FF88" stroke-width="1.5" opacity="0.25" rx="4"/>

  <!-- Shield icon (left side) -->
  <circle cx="165" cy="295" r="75" fill="none"
    stroke="#00FF88" stroke-width="3" opacity="0.9"/>
  <polyline points="130,295 155,323 200,262"
    fill="none" stroke="#00FF88" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand name -->
  <text x="278" y="318" font-family="Arial, Helvetica, sans-serif"
    font-size="82" font-weight="bold" fill="#ffffff"
    letter-spacing="-1">PrivacyKit</text>

  <!-- Tagline -->
  <text x="278" y="370" font-family="Arial, Helvetica, sans-serif"
    font-size="30" fill="#a0a0a0" letter-spacing="0.5">
    Free Cybersecurity &amp; Privacy Tools
  </text>

  <!-- Divider -->
  <line x1="80" y1="425" x2="1120" y2="425"
    stroke="rgba(0,255,136,0.15)" stroke-width="1"/>

  <!-- Tool pills -->
  <rect x="80" y="455" width="230" height="42" rx="21"
    fill="rgba(0,255,136,0.1)" stroke="rgba(0,255,136,0.3)"
    stroke-width="1"/>
  <text x="195" y="482" font-family="Arial" font-size="18"
    fill="#00FF88" text-anchor="middle">Password Checker</text>

  <rect x="326" y="455" width="195" height="42" rx="21"
    fill="rgba(0,180,216,0.1)" stroke="rgba(0,180,216,0.3)"
    stroke-width="1"/>
  <text x="423" y="482" font-family="Arial" font-size="18"
    fill="#00B4D8" text-anchor="middle">IP Lookup</text>

  <rect x="537" y="455" width="215" height="42" rx="21"
    fill="rgba(255,204,0,0.1)" stroke="rgba(255,204,0,0.3)"
    stroke-width="1"/>
  <text x="644" y="482" font-family="Arial" font-size="18"
    fill="#ffcc00" text-anchor="middle">Breach Checker</text>

  <!-- Bottom left domain -->
  <text x="80" y="580" font-family="Arial, Helvetica, sans-serif"
    font-size="26" fill="#00FF88" opacity="0.9">privacykit.tech</text>

  <!-- Bottom right tagline -->
  <text x="1120" y="580" font-family="Arial, Helvetica, sans-serif"
    font-size="22" fill="#ffffff" opacity="0.6"
    text-anchor="end">No Login · No Tracking · 100% Free</text>

</svg>
